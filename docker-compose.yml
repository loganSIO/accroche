services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: accroche-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: accroche
      POSTGRES_PASSWORD: accroche_dev_2026
      POSTGRES_DB: accroche
    ports:
      - "5432:5432"
    volumes:
      - accroche_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accroche"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  accroche_pgdata: